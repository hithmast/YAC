name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -v

      - name: Syntax-check optional backends (browser/smart, deps not installed)
        run: python -m py_compile checkers/browser_checker.py checkers/smart_checker.py

      - name: Compile-check every module
        run: python -m compileall -q main.py utils checkers
