# YAC website configuration.
#
# Common keys (all modes):
#   mode              = requests | browser | smart | o365 | okta   (default: requests)
#   login_url         = target login page URL (informational for o365/okta --
#                       they talk to a protocol endpoint instead, see below)
#   strategy          = pairs | spray   (default: pairs)
#     pairs: read known/paired credentials from credentials_file (a Username,Password CSV)
#     spray: cross product of username_list x password_list, ordered wide-before-deep
#            (every user gets password #1 before anyone gets password #2, etc.)
#   credentials_file  = path to a CSV with Username,Password columns (strategy=pairs)
#   username_list / password_list = one value per line (strategy=spray)
#   output_file       = where per-site results are written
#   success_indicators / failure_indicators = comma-separated text snippets
#   success_url_contains / failure_url_contains = comma-separated URL snippets
#     checked against the final URL after submitting (handles redirect-based
#     SPA/OAuth-style flows better than text indicators alone)
#   lockout_indicators = comma-separated text snippets that mean "this account
#     is now locked out" -- once seen for a username, every remaining queued
#     attempt for that username is skipped instead of making it worse.
#     (o365/okta classify lockout from the protocol response automatically;
#     this is for requests/browser mode against arbitrary sites.)
#   lockout_interval  = minimum seconds between two attempts against the same
#     username, enforced across the whole run regardless of concurrency
#     (default: 0 -- disabled). This is what actually keeps a password spray
#     under a typical lockout threshold.
#   concurrency       = max in-flight attempts for this site (default: 3)
#   delay_min/delay_max = randomized delay in seconds between attempts,
#     per concurrent slot (defaults: 0/0) -- use this to avoid lockouts/WAFs
#   timeout           = per-attempt timeout in seconds (default: 15 requests / 20 browser)
#   proxy             = optional proxy URL, e.g. http://127.0.0.1:8080
#   h_<name>          = extra HTTP header
#   p_<name>          = extra POST payload field
#
# Bot/CAPTCHA protection: every backend scans responses for common CAPTCHA and
# bot-mitigation markers (reCAPTCHA, hCaptcha, Cloudflare/Akamai challenge
# pages, ...). If that happens 3 times on one site, YAC stops attempting
# further credentials against it for the rest of the run -- it never tries to
# solve or bypass the challenge.
#
# Resume: pass --resume (with an optional --state-dir) on the command line to
# skip credential pairs already attempted in a prior run of the same site and
# checkpoint new ones as they complete. No config needed for this.
#
# mode=requests only:
#   username_field / password_field = HTML form field names (default: username/password)
#   csrf_field        = form field name of a CSRF token to auto-fetch and inject
#   csrf_fetch_url    = page to GET before POSTing to scrape the CSRF token from
#                       (defaults to login_url)
#   max_retries / retry_backoff = retry count and exponential backoff base (seconds)
#
# mode=browser only (requires: pip install -r requirements-browser.txt && playwright install chromium):
#   username_selector / password_selector / submit_selector = CSS selectors
#     (auto-detected via common heuristics if omitted)
#   success_selector / failure_selector = CSS selector checked after submit
#   headless          = true|false (default: true)
#
# mode=smart only (requires browser-use; needs an LLM API key, e.g. OPENAI_API_KEY env var):
#   llm_provider      = openai | anthropic | google | groq (default: openai)
#   llm_model         = model name (default: gpt-4.1-mini)
#   max_steps         = max agent steps before giving up (default: 25)
#   task_template     = override the natural-language instructions given to the
#     agent; supports {login_url} {username} {password} placeholders
#   headless          = true|false (default: true)
#
# mode=o365 only (Microsoft 365 / Azure AD -- classifies AADSTS error codes,
# so MFA-required/Conditional-Access-blocked are correctly reported as valid
# credentials even though sign-in didn't fully complete):
#   tenant            = Azure AD tenant ID or domain (default: common)
#   client_id         = OAuth client_id (default: Microsoft's public
#                       first-party "Azure PowerShell" client, works against
#                       any tenant without app consent)
#   resource          = OAuth resource (default: https://graph.windows.net)
#   token_endpoint    = override the full token URL (e.g. for Azure Government:
#                       https://login.microsoftonline.us/{tenant}/oauth2/token)
#
# mode=okta only (classifies Okta Authn API status codes the same way):
#   okta_domain       = your Okta org domain, e.g. yourorg.okta.com

[WebSite1]
mode = requests
strategy = pairs
login_url = https://example.com/login
credentials_file = combo1.csv
username_field = UserName
password_field = Password
success_indicators = Welcome, Dashboard, Logged in, Log Out
failure_indicators = Incorrect credentials, Invalid username/password, Incorrect user ID or password
lockout_indicators = Your account has been locked
output_file = results/combo1-result.csv
concurrency = 5
delay_min = 0.5
delay_max = 1.5
h_content-type = application/x-www-form-urlencoded
h_user-agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36

[WebSite2-JSApp]
mode = browser
login_url = https://example.com/app/login
credentials_file = combo1.csv
output_file = results/website2-result.csv
username_selector = input[name='email']
password_selector = input[name='password']
submit_selector = button[type='submit']
success_url_contains = /dashboard, /home
failure_selector = .error-message
concurrency = 2
delay_min = 1
delay_max = 3
headless = true

[WebSite3-ModernSPA]
mode = smart
login_url = https://example.com/signin
credentials_file = combo1.csv
output_file = results/website3-result.csv
llm_provider = openai
llm_model = gpt-4.1-mini
max_steps = 20
concurrency = 1
delay_min = 2
delay_max = 5
headless = true

[Contoso-O365]
mode = o365
strategy = spray
login_url = https://login.microsoftonline.com/
tenant = contoso.onmicrosoft.com
username_list = usernames.txt
password_list = passwords.txt
output_file = results/contoso-o365-result.csv
concurrency = 1
lockout_interval = 30
delay_min = 1
delay_max = 3

[Contoso-Okta]
mode = okta
strategy = spray
login_url = https://contoso.okta.com/
okta_domain = contoso.okta.com
username_list = usernames.txt
password_list = passwords.txt
output_file = results/contoso-okta-result.csv
concurrency = 1
lockout_interval = 30
delay_min = 1
delay_max = 3
